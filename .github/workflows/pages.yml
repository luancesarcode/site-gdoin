name: Publicar site GDOIN

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/scripts/build-pages.py'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - '.github/scripts/build-pages.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validar e preparar site
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v6
      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validar páginas e preparar arquivos públicos
        run: python .github/scripts/build-pages.py
      - name: Verificar JavaScript
        shell: bash
        run: |
          for file in site/js/*.js; do
            node --check "$file"
          done
      - name: Enviar arquivos para publicação
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publicar no GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
